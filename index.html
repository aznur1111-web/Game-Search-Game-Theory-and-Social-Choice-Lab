/* ================= 2 Pruning and evaluation ================= */
{id:"alpha-beta",title:"Alpha-beta pruning",level:3,kind:"Pruning",status:"Runnable teaching lab",
 summary:"Alpha-beta returns the same value as minimax while pruning branches that cannot influence the result. With perfect move ordering it visits O(b^(d/2)) nodes instead of O(b^d).",
 mental:"Stop looking when a branch is already refuted",
 mentalText:"Keep a window [alpha, beta]. If a node's value falls outside the window, the parent will never choose it, so stop exploring it.",
 steps:["Initialize alpha = -infinity, beta = +infinity.","At a MAX node, update alpha with each child.","If alpha >= beta, prune (cut off remaining children).","At a MIN node, update beta with each child.","If alpha >= beta, prune."],
 pseudo:"alpha_beta(state, depth, alpha, beta, maximizing):\n  if depth == 0 or terminal(state):\n    return evaluate(state)\n  if maximizing:\n    value = -infinity\n    for child in children(state):\n      value = max(value, alpha_beta(child, depth-1, alpha, beta, False))\n      alpha = max(alpha, value)\n      if alpha >= beta: break   # beta cutoff\n    return value\n  else:\n    value = +infinity\n    for child in children(state):\n      value = min(value, alpha_beta(child, depth-1, alpha, beta, True))\n      beta = min(beta, value)\n      if alpha >= beta: break   # alpha cutoff\n    return value\n\nBest case (perfect ordering): O(b^(d/2))\nWorst case (no ordering): O(b^d)",
 invariant:"Pruning is safe only if the pruned branch cannot change the value at any ancestor.",
 uses:"Every modern game engine. Also in general minimax search.",
 strength:"Same result as minimax with far fewer nodes.",
 limits:"Speedup depends on move ordering. Random ordering gives little pruning.",
 pitfall:"Pruning the wrong branch changes the value. The alpha-beta window must be maintained correctly at every node.",
 question:"With perfect ordering, how many nodes does alpha-beta visit compared to minimax?",
 answer:"O(b^(d/2)) instead of O(b^d). This effectively doubles the searchable depth.",
 demo:"alpha-beta",sample:"4 3 7",refs:[
  ["Knuth and Moore, An analysis of alpha-beta pruning, Artificial Intelligence 1975","https://doi.org/10.1016/0004-3702(75)90019-3"],
  ["Russell and Norvig, AI: A Modern Approach, Section 5.3","https://aima.cs.berkeley.edu/"],
  ["Pearl, Heuristics: Intelligent Search Strategies for Computer Problem Solving, 1984","https://www.pearson.com/en-us/subject-catalog/p/heuristics-intelligent-search-strategies-for-computer-problem-solving/P200000003299"]]},
{id:"move-ordering",title:"Move ordering and iterative deepening",level:4,kind:"Pruning",status:"Runnable teaching lab",
 summary:"Alpha-beta prunes more when good moves are tried first. Move ordering heuristics (killer moves, history, MVV-LVA) make pruning effective. Iterative deepening searches depth 1, 2, 3, ... and reuses the best move from the previous depth to order the next.",
 mental:"Try the best move first so the opponent can refute quickly",
 mentalText:"If a strong move is searched first, its value raises alpha or lowers beta, and the remaining moves are cut off. Iterative deepening provides good ordering almost for free.",
 steps:["Search depth 1, get the best move.","At depth 2, try the best move from depth 1 first.","Continue increasing depth.","Use the previous best move, killer moves and history to order children."],
 pseudo:"iterative_deepening(state, max_depth):\n  best_move = None\n  for depth in 1..max_depth:\n    score, best = alpha_beta_root(state, depth, best_move)\n    best_move = best\n    if time_up: break\n  return best_move\n\nOrdering heuristics:\n  - previous best move (PV move)\n  - captures: MVV-LVA (most valuable victim, least valuable attacker)\n  - killer moves: quiet moves that caused a cutoff at the same depth\n  - history heuristic: quiet moves that caused cutoffs in the past\n  - transposition table move",
 invariant:"Ordering is a heuristic. It cannot change the value of alpha-beta, only the number of nodes visited.",
 uses:"Any alpha-beta engine. Iterative deepening also gives anytime behavior.",
 strength:"Large node reductions with simple heuristics.",
 limits:"Ordering heuristics can be wrong and waste effort. Killer and history tables need maintenance.",
 pitfall:"Iterative deepening is not wasteful: the cost of shallow searches is dominated by the cost of the deepest search.",
 question:"Why is iterative deepening not a waste of time?",
 answer:"The number of nodes grows geometrically with depth, so the deepest search dominates the total. The shallow searches are almost free and provide good move ordering.",
 demo:"move-ordering",sample:"4 3 7",refs:[
  ["Knuth and Moore, An analysis of alpha-beta pruning, 1975","https://doi.org/10.1016/0004-3702(75)90019-3"],
  ["Reinefeld, An improvement to the Scout tree search algorithm, ICCA Journal 1983","https://doi.org/10.3233/ICG-1983-6407"],
  ["Russell and Norvig, AI: A Modern Approach, Chapter 5","https://aima.cs.berkeley.edu/"]]},
{id:"transposition-tables",title:"Transposition tables",level:4,kind:"Pruning",status:"Runnable teaching lab",
 summary:"A transposition table caches the value of a state so that positions reached by different move orders are not re-searched. Zobrist hashing gives an efficient key.",
 mental:"Cache the value of every position you have seen",
 mentalText:"Many move orders lead to the same position. Store the result in a hash table keyed by the position. On revisit, return the cached value.",
 steps:["Hash the state (Zobrist or similar).","Look up the hash in the table.","If stored with sufficient depth, return the value.","Otherwise search and store the result."],
 pseudo:"transposition_table(state, depth, alpha, beta):\n  key = zobrist_hash(state)\n  entry = table.get(key)\n  if entry and entry.depth >= depth:\n    if entry.flag == EXACT: return entry.value\n    if entry.flag == LOWER and entry.value >= beta: return entry.value\n    if entry.flag == UPPER and entry.value <= alpha: return entry.value\n  value = alpha_beta(state, depth, alpha, beta)\n  flag = EXACT\n  if value <= alpha: flag = UPPER\n  elif value >= beta: flag = LOWER\n  table.put(key, {value, depth, flag})\n  return value\n\nZobrist hashing:\n  each piece-square pair gets a random 64-bit number\n  hash(state) = XOR of the numbers for all pieces on the board\n  update in O(1) when a piece moves",
 invariant:"The table value must be valid for the current search window. Flags (EXACT, LOWER, UPPER) record which window the value is valid for.",
 uses:"Chess, checkers, Go, any game with transpositions.",
 strength:"Large savings when the game has many transpositions.",
 limits:"Memory. Collisions with weak hashing. Table must be cleared or aged.",
 pitfall:"Storing only the value without the depth or flag can return wrong results when the same position is searched at a different depth.",
 question:"What is a transposition in a game tree?",
 answer:"Reaching the same position through different sequences of moves. In chess this is common (e.g., Nf3 then d4 vs d4 then Nf3).",
 demo:"transposition-tables",sample:"6 3",refs:[
  ["Zobrist, A new hashing method with application for game playing, 1970","https://www.cs.wisc.edu/techreports/1970/TR88.pdf"],
  ["Breuker, Memory versus search in games, Ph.D. thesis 1998","https://research.tilburguniversity.edu/en/publications/memory-versus-search-in-games"],
  ["cp-algorithms.com, Zobrist hashing","https://cp-algorithms.com/algebra/zobrist-hashing.html"]]},
/* ================= 3 Deeper search methods ================= */
{id:"quiescence-nullmove",title:"Quiescence search and null-move pruning",level:5,kind:"Deep search",status:"Concept lesson",
 summary:"Quiescence search extends the search at leaf nodes by looking only at forcing moves (captures, checks) to avoid the horizon effect. Null-move pruning skips a turn to get a quick lower bound.",
 mental:"Do not stop in the middle of a tactical exchange",
 mentalText:"A fixed-depth search can stop just before a capture, giving a misleading score. Quiescence keeps searching forcing moves until the position is quiet.",
 steps:["At depth 0, instead of evaluating, run a quiescence search on forcing moves.","Null-move: give the opponent a free move; if the score is still too good, prune."],
 pseudo:"quiescence(state, alpha, beta):\n  stand_pat = evaluate(state)\n  if stand_pat >= beta: return beta\n  if stand_pat > alpha: alpha = stand_pat\n  for move in forcing_moves(state):\n    score = -quiescence(apply(state, move), -beta, -alpha)\n    if score >= beta: return beta\n    if score > alpha: alpha = score\n  return alpha\n\nnull_move(state, depth, alpha, beta):\n  if depth >= 3 and not in_check(state) and has_non_pawn_material(state):\n    R = 2   # reduction\n    score = -alpha_beta(pass_turn(state), depth - 1 - R, -beta, -beta + 1)\n    if score >= beta: return beta\n  return alpha_beta(state, depth, alpha, beta)",
 invariant:"Null-move pruning assumes zugzwang is rare. In zugzwang-heavy endgames it can be wrong.",
 uses:"Chess engines (Stockfish, Komodo). Quiescence is in every serious chess engine.",
 strength:"Avoids the horizon effect. Null-move gives large depth increases.",
 limits:"Null-move can fail in zugzwang positions. Quiescence can explode without good ordering.",
 pitfall:"Quiescence must include all forcing moves. Missing a check or capture can still miss tactics.",
 question:"What is the horizon effect?",
 answer:"A fixed-depth search stops before a critical event, producing a misleading evaluation. Quiescence search extends the search past the horizon for forcing moves.",
 demo:"none",sample:"",refs:[
  ["Beal, Experiments with the null-move heuristic, ICCA Journal 1989","https://doi.org/10.3233/ICG-1989-12403"],
  ["Kaindl and Horacek, A practical null-move pruning scheme, 1995","https://doi.org/10.1007/BFb0029922"],
  ["Chess Programming Wiki, Quiescence search","https://www.chessprogramming.org/Quiescence_Search"]]},
{id:"pvs-killer",title:"Principal variation search and killer heuristic",level:5,kind:"Deep search",status:"Concept lesson",
 summary:"PVS searches the first move with a full window and the rest with a null window, re-searching only if a move exceeds the first. Killer moves are quiet moves that caused cutoffs at the same depth and are tried early.",
 mental:"Assume the first move is best and verify the rest cheaply",
 mentalText:"Search the first move normally. For the others, search with a zero-width window. If one beats the first, re-search it with a full window.",
 steps:["Search the first child with [alpha, beta].","For each remaining child, search with [alpha, alpha+1].","If the null-window search returns > alpha, re-search with [alpha, beta].","Store killer moves for use at the same depth."],
 pseudo:"pvs(state, depth, alpha, beta):\n  if depth == 0: return evaluate(state)\n  first = True\n  for move in ordered_moves(state):\n    if first:\n      score = -pvs(apply(state, move), depth-1, -beta, -alpha)\n      first = False\n    else:\n      score = -pvs(apply(state, move), depth-1, -alpha-1, -alpha)\n      if alpha < score < beta:\n        score = -pvs(apply(state, move), depth-1, -beta, -alpha)\n    if score >= beta:\n      record_killer(depth, move)\n      return beta\n    if score > alpha: alpha = score\n  return alpha\n\nKiller heuristic:\n  for each depth, store 1-2 quiet moves that caused a cutoff\n  try them first at sibling nodes at the same depth",
 invariant:"The null-window search is exact for fail-low results. A fail-high must be re-searched with a full window.",
 uses:"Every modern chess and checkers engine.",
 strength:"Fewer nodes than plain alpha-beta with good ordering.",
 limits:"Re-searches can cost extra if the move ordering is poor.",
 pitfall:"Forgetting the re-search can return a wrong value. The null window is only used for a quick verification.",
 question:"What is a null window in PVS?",
 answer:"A search window [alpha, alpha+1]. It only tells you whether the move is better than alpha, not by how much. If it is, a full re-search is needed.",
 demo:"none",sample:"",refs:[
  ["Marsland and Campbell, Parallel search of strongly ordered game trees, ACM Computing Surveys 1982","https://doi.org/10.1145/356893.356897"],
  ["Reinefeld, An improvement to the Scout tree search algorithm, 1983","https://doi.org/10.3233/ICG-1983-6407"],
  ["Chess Programming Wiki, Principal variation search","https://www.chessprogramming.org/Principal_Variation_Search"]]},
{id:"mtdf",title:"MTD(f) and zero-window searches",level:5,kind:"Deep search",status:"Concept lesson",
 summary:"MTD(f) drives a sequence of zero-window alpha-beta searches, using a transposition table to converge to the minimax value. Often faster than plain alpha-beta in chess.",
 mental:"Binary search the game value with null-window searches",
 mentalText:"Start with a guess. Search with a null window around the guess. The result tells you which side the true value is on. Update the guess and repeat.",
 steps:["Initialize the guess g.","Search with window [g-1, g] (null window).","If the search fails high, the true value is >= g; raise the lower bound.","If it fails low, lower the upper bound.","Repeat until the bounds meet."],
 pseudo:"mtdf(state, first_guess):\n  g = first_guess\n  lower = -infinity\n  upper = +infinity\n  while lower < upper:\n    beta = max(g, lower + 1)\n    g = alpha_beta(state, beta-1, beta)\n    if g < beta: upper = g\n    else: lower = g\n  return g\n\nThe transposition table stores the exact value once the window is narrow enough. MTD(f) exploits this heavily.",
 invariant:"The null window must be handled correctly with the transposition table so the stored bounds remain valid.",
 uses:"Chess engines, especially with large transposition tables.",
 strength:"Fewer nodes than plain alpha-beta when the guess is good.",
 limits:"Many null-window searches. Sensitive to the initial guess and the transposition table.",
 pitfall:"Without a good transposition table, MTD(f) can be slower than plain alpha-beta.",
 question:"Why does MTD(f) use null windows?",
 answer:"A null window [beta-1, beta] only tells you whether the value is below or above beta. That is enough to binary search the value and it maximizes pruning.",
 demo:"none",sample:"",refs:[
  ["Plaat et al., Best-first fixed-depth minimax algorithms, Artificial Intelligence 1996","https://doi.org/10.1016/0004-3702(95)00082-8"],
  ["Aske Plaat, MTD(f), a new search algorithm, 1996","https://askeplaat.wordpress.com/2016/04/27/mtd-f/"],
  ["Chess Programming Wiki, MTD(f)","https://www.chessprogramming.org/MTD(f)"]]},

{id:"mcts-uct",title:"Monte Carlo tree search and UCT",level:4,kind:"Heuristic search",status:"Runnable teaching lab",
 summary:"MCTS builds a search tree by sampling. Each iteration selects a promising node (UCT), expands it, simulates a random playout, and backpropagates the result. No evaluation function needed.",
 mental:"Sample many random games and keep statistics on the best moves",
 mentalText:"At each node, balance exploiting moves with high win rates and exploring moves with few visits. UCT formalizes this as an upper confidence bound.",
 steps:["Selection: descend the tree using UCT until a leaf.","Expansion: add one child.","Simulation: play out randomly to a terminal state.","Backpropagation: update visit counts and win totals."],
 pseudo:"uct_search(root, iterations):\n  for i in 1..iterations:\n    node = select(root)   # UCT\n    node = expand(node)\n    result = simulate(node)\n    backpropagate(node, result)\n  return best_child(root)\n\nUCT selection:\n  for each child c of node:\n    ucb(c) = Q(c)/N(c) + c_const * sqrt(ln N(node) / N(c))\n  pick child with max ucb\n\nQ = total reward, N = visit count\nc_const ~ sqrt(2) for rewards in [0,1]",
 invariant:"UCT converges to the minimax value as the number of iterations grows.",
 uses:"Go (AlphaGo), general game playing, planning, real-time strategy games.",
 strength:"No evaluation function. Anytime. Works with huge branching factors.",
 limits:"Slow when the game tree is deep and simulations are expensive.",
 pitfall:"The exploration constant must be tuned. Too small and it converges to a suboptimal move.",
 question:"What is the exploration constant c in UCT?",
 answer:"A constant that balances exploitation (Q/N) and exploration (sqrt(ln N / N)). Common choice is sqrt(2) for rewards in [0,1].",
 demo:"mcts-uct",sample:"1000 1.41",refs:[
  ["Coulom, Efficient selectivity and backup operators in Monte-Carlo tree search, 2006","https://doi.org/10.1007/978-3-540-75538-8_7"],
  ["Kocsis and Szepesvári, Bandit based Monte-Carlo planning, ECML 2006","https://doi.org/10.1007/11871842_29"],
  ["Browne et al., A survey of Monte Carlo tree search methods, IEEE TCIAIG 2012","https://doi.org/10.1109/TCIAIG.2012.2186810"]]},
{id:"proof-number",title:"Proof-number search and endgame tablebases",level:5,kind:"Proof search",status:"Concept lesson",
 summary:"Proof-number search (PNS) is a best-first search for proving or disproving a game-theoretic claim. Endgame tablebases store exact values for all positions with a small number of pieces.",
 mental:"Prove or disprove: search where the proof is closest",
 mentalText:"Each node has a proof number (minimum leaves needed to prove it) and a disproof number (minimum needed to disprove it). Expand the most promising node.",
 steps:["Assign proof and disproof numbers to leaves.","Propagate: proof(node) = min over children, disproof(node) = sum over children (for AND/OR nodes).","Expand the child with the smallest proof (or disproof) number.","Repeat until the root is proved or disproved."],
 pseudo:"proof_number_search(root):\n  initialize pn, dn for all leaves\n  while root not proved or disproved:\n    node = select_most_proving(root)\n    expand(node)\n    update_pn_dn(node)\n  return root status\n\npn(node) = min over children pn(child)   (OR node)\ndn(node) = sum over children dn(child)  (OR node)\n\nFor AND nodes:\n  pn = sum, dn = min\n\nEndgame tablebases:\n  enumerate all positions with <= N pieces\n  compute win/draw/loss by retrograde analysis\n  store in a compact index (e.g., Syzygy, Nalimov)\n  Lomonosov: 7-piece chess tablebases (~140 TB)",
 invariant:"Proof and disproof numbers are admissible: they never overestimate the true effort.",
 uses:"Chess endgames, Connect Four, game solving, theorem proving.",
 strength:"Finds proofs when they exist and are shallow.",
 limits:"Memory for tablebases. PNS can be slow on deep proofs.",
 pitfall:"Tablebases only cover positions with few pieces. Outside that range the engine must search.",
 question:"How many pieces does the largest chess endgame tablebase cover?",
 answer:"7 pieces (Lomonosov tablebases), stored in about 140 TB.",
 demo:"none",sample:"",refs:[
  ["Allis, Searching for solutions in games and artificial intelligence, Ph.D. thesis 1994","https://www.cs.uu.nl/research/techreps/repo/CS-1994/1994-29.pdf"],
  ["Nagai, Proof-number search, 2002","https://www.sciencedirect.com/science/article/pii/S0004370201001411"],
  ["Lutz, Das 7-Steine-Endspiel ist gelöst, 2012","https://ldm.silvertree.org/"]]},

{id:"nim",title:"Nim and the nim-sum",level:3,kind:"Combinatorial game",status:"Runnable teaching lab",
 summary:"Nim is a two-player game with several heaps. Players alternately remove any number of objects from one heap. The player who takes the last object wins (normal play). The winning strategy is to make the XOR of heap sizes zero.",
 mental:"The XOR of heap sizes tells you who wins",
 mentalText:"If the XOR is zero, the player to move loses with optimal play. Otherwise there is a move that makes the XOR zero.",
 steps:["Compute the XOR of all heap sizes.","If zero, the position is losing (P-position).","If nonzero, find a heap whose size XOR'd with the XOR is smaller.","Reduce that heap to the smaller value."],
 pseudo:"nim_sum(heaps) = XOR of all heap sizes\n\nP-position (previous player wins):\n  nim_sum = 0\n\nN-position (next player wins):\n  nim_sum != 0\n\nWinning move:\n  find heap i with (heaps[i] XOR nim_sum) < heaps[i]\n  reduce heap i to heaps[i] XOR nim_sum",
 invariant:"Nim is a P-position iff the XOR of heap sizes is zero. This is Bouton's theorem.",
 uses:"Teaching combinatorial game theory. The Sprague-Grundy theorem generalizes nim-sum to any impartial game.",
 strength:"Complete, simple characterization of all positions.",
 limits:"Only for Nim. Other games need the Grundy numbers.",
 pitfall:"Misère Nim has a different rule: if all heaps are size 1, the parity reverses. Otherwise the same nim-sum applies.",
 question:"Is [3, 4, 5] a winning position?",
 answer:"Yes. 3 XOR 4 XOR 5 = 2. Nonzero, so it is an N-position. Reduce heap 3 from 3 to 1 (3 XOR 2 = 1).",
 demo:"nim",sample:"3 4 5",refs:[
  ["Bouton, Nim, a game with a complete mathematical theory, Annals of Mathematics 1901","https://doi.org/10.2307/1967631"],
  ["Berlekamp, Conway, Guy, Winning Ways for Your Mathematical Plays, 1982","https://www.routledge.com/Winning-Ways-for-Your-Mathematical-Plays/Berlekamp-Conway-Guy/p/book/9781568811307"],
  ["Wikipedia, Nim","https://en.wikipedia.org/wiki/Nim"]]},
{id:"sprague-grundy",title:"Sprague-Grundy theorem",level:4,kind:"Combinatorial game",status:"Runnable teaching lab",
 summary:"Every impartial game under normal play is equivalent to a Nim heap. The size of the heap is the Grundy number (nimber) of the position, computed by mex of the Grundy numbers of the options.",
 mental:"Every impartial game is a disguised Nim heap",
 mentalText:"Compute the Grundy number of each position as the smallest non-negative integer not among the Grundy numbers of its options. The Grundy number of a sum of games is the XOR of the components.",
 steps:["Identify the terminal positions (Grundy 0).","For each position, compute the set of Grundy numbers of its options.","Take the mex (smallest non-negative integer not in the set).","For a sum of games, XOR the Grundy numbers."],
 pseudo:"grundy(state):\n  if terminal(state): return 0\n  reachable = set()\n  for move in moves(state):\n    reachable.add(grundy(apply(state, move)))\n  g = 0\n  while g in reachable: g += 1\n  return g\n\nSprague-Grundy theorem:\n  every impartial game is equivalent to a Nim heap of size grundy(state)\n  the sum of games has grundy = XOR of grundy values\n  the position is a P-position iff XOR = 0",
 invariant:"The mex computation assumes normal play (last move wins). Misère play needs a different treatment.",
 uses:"Any impartial game: Nim variants, subtraction games, Green Hackenbush, turning turtles.",
 strength:"Completely solves any impartial game in polynomial time (in the number of positions).",
 limits:"Only for impartial games. Partizan games (e.g., chess) need surreal numbers or other tools.",
 pitfall:"The mex must be taken over the set of reachable Grundy numbers, not the set of moves.",
 question:"What is the Grundy number of a subtraction game with moves {1, 2, 3}?",
 answer:"G(0)=0, G(1)=1, G(2)=2, G(3)=3, G(4)=0, G(5)=1, ... It repeats with period 4.",
 demo:"sprague-grundy",sample:"1 2 3\n20",refs:[
  ["Sprague, Über mathematische Kampfspiele, 1935","https://doi.org/10.1007/BF01360633"],
  ["Grundy, Mathematics and games, Eureka 1939","https://www.jstor.org/stable/3021666"],
  ["Berlekamp, Conway, Guy, Winning Ways, 1982","https://www.routledge.com/Winning-Ways-for-Your-Mathematical-Plays/Berlekamp-Conway-Guy/p/book/9781568811307"]]},
{id:"misere",title:"Misère play",level:4,kind:"Combinatorial game",status:"Runnable teaching lab",
 summary:"In misère play, the player who makes the last move loses. Nim has a simple misère strategy: if all heaps are size 1, parity decides; otherwise play like normal Nim.",
 mental:"Last move loses instead of wins",
 mentalText:"The entire theory changes. For Nim, if all heaps have size 1, the parity of the number of heaps decides the winner. Otherwise the normal nim-sum still applies.",
 steps:["Check if all heaps have size 1.","If yes, the position is a P-position iff the number of heaps is odd.","Otherwise, compute the nim-sum. P-position iff nim-sum = 0."],
 pseudo:"misere_nim(heaps):\n  if all(h <= 1 for h in heaps):\n    return 'P-position' if len(heaps) % 2 == 1 else 'N-position'\n  else:\n    return 'P-position' if nim_sum(heaps) == 0 else 'N-position'\n\nIntuition:\n  with all 1s, each move takes one heap\n  players alternate taking heaps\n  the last player to move loses\n  so the first player wins iff the number of heaps is even",
 invariant:"The misère version of a game is not the same as the normal version. Grundy numbers do not directly apply.",
 uses:"Misère Nim, misère Kayles, misère Hackenbush, combinatorial game theory.",
 strength:"Simple for Nim. The general theory uses genus theory or misère quotients.",
 limits:"Misère play is much harder than normal play for general games. No simple Grundy-like theorem.",
 pitfall:"Assuming the normal-play strategy works. For [1, 1, 1] misère, the first player loses, but the nim-sum is 1 (nonzero).",
 question:"Who wins [1, 1] in misère Nim?",
 answer:"The first player. They take one heap, leaving [1]. The second player must take the last object and loses.",
 demo:"misere",sample:"1 1 1",refs:[
  ["Conway, On Numbers and Games, 1976","https://www.routledge.com/On-Numbers-and-Games/Conway/p/book/9781568811277"],
  ["Siegel, Misère games and misère quotients, 2013","https://arxiv.org/abs/1305.3883"],
  ["Berlekamp, Conway, Guy, Winning Ways, 1982","https://www.routledge.com/Winning-Ways-for-Your-Mathematical-Plays/Berlekamp-Conway-Guy/p/book/9781568811307"]]},
/* ================= 6 Strategic games and equilibria ================= */
{id:"nash-equilibrium",title:"Nash equilibrium and support enumeration",level:4,kind:"Equilibrium",status:"Runnable teaching lab",
 summary:"A Nash equilibrium is a strategy profile where no player can improve by deviating alone. In finite games, a mixed Nash equilibrium always exists. Support enumeration finds all equilibria in small games.",
 mental:"No player wants to change their strategy",
 mentalText:"At equilibrium, every player's strategy is a best response to the others. Pure equilibria are easy to spot. Mixed equilibria make opponents indifferent.",
 steps:["Enumerate all support pairs (subsets of actions for each player).","For each support, solve the indifference equations.","Check that the solution is a valid mixed strategy (non-negative, sums to 1).","Check that no action outside the support is better."],
 pseudo:"support_enumeration(A, B):\n  for each support I of player 1, J of player 2:\n    if |I| != |J|: continue\n    solve for x on support I, y on support J:\n      sum_{j in J} A[i][j] y_j = u for all i in I\n      sum_{j in J} y_j = 1\n      sum_{i in I} B[i][j] x_i = v for all j in J\n      sum_{i in I} x_i = 1\n    if all x_i, y_j >= 0:\n      check best response: no action outside support beats u, v\n      if ok: record equilibrium\n\nExistence: every finite game has at least one Nash equilibrium (Nash 1950).",
 invariant:"A mixed equilibrium requires the opponent to be indifferent among the actions in their support.",
 uses:"Economics, game theory, multi-agent systems, poker, security games.",
 strength:"Complete for small games. Always terminates.",
 limits:"Exponential in the number of actions. Intractable for large games.",
 pitfall:"Pure equilibria may exist alongside mixed ones. Support enumeration must check all sizes.",
 question:"Does every finite game have a Nash equilibrium?",
 answer:"Yes, in mixed strategies. This is Nash's theorem (1950). Pure equilibria may not exist (e.g., matching pennies).",

{id:"minimax-theorem",title:"Minimax theorem and zero-sum games",level:4,kind:"Equilibrium",status:"Concept lesson",
 summary:"In a two-player zero-sum game, the value of the game exists and is unique. The row player maximizes the minimum payoff; the column player minimizes the maximum. Mixed strategies are generally required.",
 mental:"The value of a zero-sum game is the same whoever moves first",
 mentalText:"The max-min and min-max values are equal. This is the minimax theorem (von Neumann 1928).",
 steps:["Write the payoff matrix A for the row player.","Solve the LP: maximize v subject to sum_i x_i A[i][j] >= v for all j.","The optimal v is the value of the game.","The column player's optimal strategy comes from the dual."],
 pseudo:"minimax theorem:\n  max_x min_y x^T A y = min_y max_x x^T A y = v\n\nLP formulation (row player):\n  maximize v\n  subject to sum_i x_i A[i][j] >= v  for all j\n             sum_i x_i = 1, x_i >= 0\n\nLP formulation (column player):\n  minimize w\n  subject to sum_j A[i][j] y_j <= w  for all i\n             sum_j y_j = 1, y_j >= 0\n\nStrong duality: v = w.",
 invariant:"The theorem holds for finite zero-sum games with mixed strategies. It does not hold for general-sum games.",
 uses:"Poker, security games, LP duality, robust optimization.",
 strength:"Reduces zero-sum games to linear programming.",
 limits:"Only for two-player zero-sum. General-sum games do not have a unique value.",
 pitfall:"Confusing the minimax theorem with the minimax algorithm. The theorem is about mixed strategies; the algorithm is about game tree search.",
 question:"What is the value of matching pennies?",
 answer:"0. Both players mix 50/50. The game is fair.",

{id:"lemke-howson",title:"Lemke-Howson algorithm",level:5,kind:"Equilibrium",status:"Concept lesson",
 summary:"The Lemke-Howson algorithm finds one Nash equilibrium of a bimatrix game by following a path of labeled vertices on the best-response polytopes. It is the classic pivoting algorithm for general-sum games.",
 mental:"Walk along the edges of two polytopes until both labels match",
 mentalText:"Each player has a polytope. Vertices are labeled by the strategies they make indifferent. The algorithm follows a path from an artificial starting point to a completely labeled vertex, which is a Nash equilibrium.",
 steps:["Form the two best-response polytopes.","Start at the artificial equilibrium (all players use a dummy strategy).","Pick a label to drop.","Follow the unique path of vertices with that label dropped.","Stop when the dropped label reappears, giving a completely labeled vertex."],
 pseudo:"lemke_howson(A, B, starting_label):\n  build polytopes P = {x >= 0 : B^T x <= 1}, Q = {y >= 0 : A y <= 1}\n  start at (0, 0) with label k dropped\n  loop:\n    pivot to the next vertex\n    if the dropped label is picked up again:\n      return the completely labeled vertex (a Nash equilibrium)\n\nComplexity:\n  worst case exponential (theoretically)\n  fast in practice for small games",
 invariant:"The path is unique and terminates at a completely labeled vertex, which is a Nash equilibrium.",
 uses:"Computing equilibria in bimatrix games, economic modeling.",
 strength:"Simple pivoting. Finds one equilibrium.",
 limits:"Exponential worst case. Only finds one equilibrium, not all.",
 pitfall:"The starting label affects which equilibrium is found. Different labels can lead to different equilibria.",
 question:"How many equilibria can a bimatrix game have?",
 answer:"An odd number for nondegenerate games (by the Lemke-Howson index theorem). It can be exponential in the size of the game.",
 demo:"none",sample:"",refs:[

{id:"regret-matching",title:"Regret matching and multiplicative weights",level:4,kind:"Equilibrium",status:"Runnable teaching lab",
 summary:"Regret matching is a simple no-regret learning algorithm. Each player tracks the regret of not having played each action, and plays proportionally to positive regret. In two-player zero-sum games, average strategies converge to Nash.",
 mental:"Play more of the actions you regret not playing",
 mentalText:"After each round, compare the payoff you got to what you would have gotten with each other action. Accumulate regret. Next round, play each action in proportion to its positive cumulative regret.",
 steps:["Initialize cumulative regrets to zero.","Play each action with probability proportional to positive regret.","Observe the payoff and the counterfactual payoffs.","Update regrets.","Repeat.","The average strategy converges to Nash in zero-sum games."],
 pseudo:"regret_matching(iterations):\n  R = [0] * num_actions\n  S = [0] * num_actions\n  for t in 1..iterations:\n    pos = [max(0, r) for r in R]\n    if sum(pos) == 0: strategy = uniform\n    else: strategy = pos / sum(pos)\n    play(strategy)\n    observe payoffs u(a)\n    for a in actions:\n      R[a] += u(a) - u(strategy)\n    S += strategy\n  return S / iterations   # average strategy\n\nConvergence:\n  zero-sum: average strategy approaches Nash\n  general-sum: average strategy approaches coarse correlated equilibrium",
 invariant:"Regret matching guarantees sublinear regret: R(T)/T -> 0. The average strategy therefore converges in zero-sum games.",
 uses:"Poker AI (Libratus, Pluribus), security games, online learning.",
 strength:"Simple. No gradient. Converges in zero-sum games.",
 limits:"Slow convergence. Requires many iterations.",
 pitfall:"Regret matching converges in average strategy, not in current strategy. The current strategy may cycle.",
 question:"Why does regret matching converge to Nash in zero-sum games?",
 answer:"In zero-sum games, low regret for both players implies the average strategy profile is close to a Nash equilibrium. This follows from the minimax theorem.",
 demo:"regret-matching",sample:"2000",refs:[
  ["Hart and Mas-Colell, A simple adaptive procedure leading to correlated equilibrium, Econometrica 2000","https://doi.org/10.1111/1468-0262.00153"],
  ["Zinkevich et al., Regret minimization in games with incomplete information, NeurIPS 2007","https://papers.nips.cc/paper/2007/hash/08d98638c6fcd194a4b1e6992063e944-Abstract.html"],

{id:"self-play",title:"Self-play and reinforcement learning",level:5,kind:"Learning",status:"Concept lesson",
 summary:"Self-play trains an agent by playing against copies of itself. The opponent improves alongside the agent, providing an automatic curriculum. This is how TD-Gammon, AlphaGo Zero and AlphaZero were trained.",
 mental:"Play yourself, improve, repeat",
 mentalText:"The agent plays both sides. After each game, update the value and policy toward the outcome. The opponent is a snapshot of the agent, so it always provides a challenge.",
 steps:["Initialize the policy and value networks randomly.","Play games with the agent on both sides.","Update the networks toward the game outcome.","Periodically snapshot the agent as the new opponent.","Repeat."],
 pseudo:"self_play(iterations):\n  policy, value = initialize_networks()\n  for i in 1..iterations:\n    games = play_games(policy, policy)\n    for (state, outcome) in games:\n      update value network toward outcome\n      update policy network toward MCTS visit counts\n    if i % snapshot_interval == 0:\n      opponent = copy(policy)\n\nKey idea:\n  the opponent is a previous version of the agent\n  as the agent improves, the opponent improves\n  no human data needed",
 invariant:"Self-play works when the game is symmetric enough that a copy of the agent is a meaningful opponent.",
 uses:"TD-Gammon, AlphaGo Zero, AlphaZero, MuZero, Pluribus.",
 strength:"No human data. Automatic curriculum. Can exceed human level.",
 limits:"Requires a good simulator. Can get stuck in local equilibria.",
 pitfall:"Self-play can cycle or collapse if the opponent is not snapshotted. Always keep a pool of past opponents.",
 question:"Why does self-play provide an automatic curriculum?",
 answer:"As the agent improves, its copy also improves. The opponent is always at the agent's level, so the difficulty scales automatically.",
 demo:"none",sample:"",refs:[
  ["Tesauro, Temporal difference learning and TD-Gammon, CACM 1995","https://doi.org/10.1145/203330.203343"],

{id:"alphazero",title:"AlphaZero and policy/value networks",level:5,kind:"Learning",status:"Concept lesson",
 summary:"AlphaZero combines MCTS with a deep neural network that outputs a policy (move probabilities) and a value (position evaluation). The network guides the search; the search generates better training targets for the network.",
 mental:"MCTS guided by a neural network, trained by self-play",
 mentalText:"The network proposes moves and evaluates positions. MCTS uses these to search. The visit counts from MCTS become the policy target; the game outcome becomes the value target.",
 steps:["Use the network to initialize MCTS priors.","Run MCTS to get visit counts.","Play a move proportional to visit counts.","Record the policy target (visit counts) and value target (game outcome).","Train the network on these targets.","Repeat."],
 pseudo:"alphazero_training():\n  network = initialize()\n  for iteration in 1..N:\n    examples = []\n    for game in 1..num_games:\n      state = initial\n      while not terminal:\n        pi = mcts(state, network)   # visit counts\n        a = sample(pi)\n        examples.append((state, pi, player))\n        state = apply(state, a)\n      z = outcome(state)\n      for (s, pi, p) in examples:\n        target_value = z if p == current_player else -z\n        store(s, pi, target_value)\n    network = train(network, examples)\n\nNetwork:\n  input: board position\n  output: policy (probability over moves), value (scalar)\n  architecture: residual CNN for board games",
 invariant:"The network and the search improve each other. The search provides better targets than the raw network; the network makes the search stronger.",
 uses:"Chess, shogi, Go, and general board games.",
 strength:"Superhuman play without human knowledge. Generalizes across games.",
 limits:"Requires a simulator and significant compute. Not directly for imperfect-information games.",
 pitfall:"The value target must be from the perspective of the player to move, not a fixed player.",
 question:"What does the policy head of AlphaZero output?",
 answer:"A probability distribution over legal moves. It is used as a prior for MCTS.",
 demo:"none",sample:"",refs:[
  ["Silver et al., Mastering chess and shogi by self-play with a general reinforcement learning algorithm, 2017","https://arxiv.org/abs/1712.01815"],

  ["AlphaZero official page","https://deepmind.google/discover/blog/alphazero-shedding-new-light-on-chess-shogi-and-go/"]]},
{id:"muzero",title:"MuZero and learned models",level:5,kind:"Learning",status:"Concept lesson",
 summary:"MuZero learns a latent dynamics model and plans in latent space. It does not need the rules of the game. It matches AlphaZero on Atari, chess, shogi and Go.",
 mental:"Learn the rules, then plan in your head",
 mentalText:"MuZero has three networks: representation, dynamics and prediction. The representation encodes a state. The dynamics predicts the next latent state and reward. The prediction gives policy and value. MCTS runs entirely in latent space.",

{id:"poker-ai",title:"Libratus, Pluribus and imperfect-information games",level:5,kind:"Learning",status:"Concept lesson",
 summary:"Poker is an imperfect-information game. Counterfactual regret minimization (CFR) minimizes regret at each information set. Libratus beat top human heads-up players; Pluribus beat six-player no-limit hold'em.",
 mental:"Learn a strategy that is hard to exploit",
 mentalText:"CFR computes the regret of each action at each information set, weighted by the probability of reaching that set. Regret matching at each information set converges to a Nash equilibrium in two-player zero-sum games.",
 steps:["Represent the game as an extensive-form tree with information sets.","Run CFR: traverse the tree, compute counterfactual values.","Update regrets at each information set.","Derive the average strategy.","For large games, use abstraction and deep learning."],
 pseudo:"cfr(game, iterations):\n  regrets = initialize at every information set\n  strategy_sum = accumulate average strategy\n  for t in 1..iterations:\n    traverse(game, history, reach_probs)\n  return strategy_sum / iterations\n\nCounterfactual regret at information set I:\n  R(I, a) = sum over histories h in I of\n              pi_{-i}(h) * (u(h, a) - u(h))\n\nRegret matching at I:\n  sigma(I, a) = max(R(I, a), 0) / sum of positives\n\nVariants:\n  CFR+ (faster convergence)\n  Monte Carlo CFR (sampled)\n  Deep CFR (function approximation)",
 invariant:"CFR converges to a Nash equilibrium in two-player zero-sum games. In multiplayer games it converges to a coarse correlated equilibrium.",
 uses:"Poker AI, security games, negotiation, any imperfect-information game.",
 strength:"Converges in theory. Scales with abstraction.",
 limits:"Full CFR is intractable for large games. Needs abstraction or sampling.",
 pitfall:"The average strategy is the equilibrium, not the current strategy. Always use the average for evaluation.",
 question:"What is an information set in poker?",
 answer:"The set of histories consistent with a player's observations. In poker, you know your cards and the public cards, but not the opponents' cards.",
 demo:"none",sample:"",refs:[

{id:"shapley",title:"Shapley value",level:4,kind:"Cooperative game",status:"Runnable teaching lab",
 summary:"The Shapley value divides the value of a coalition game among players based on their average marginal contribution. It is the unique division satisfying efficiency, symmetry, dummy and additivity.",
 mental:"Average how much each player adds to every possible coalition",
 mentalText:"For each player, look at every subset of other players. Compute the marginal value of adding this player. Weight by the probability of that subset forming. Average.",
 steps:["List all players.","For each subset not containing player i, compute the marginal contribution.","Weight by |S|! (n-|S|-1)! / n!.","Sum over all subsets."],
 pseudo:"shapley_value(v, n):\n  for i in 1..n:\n    phi[i] = 0\n    for each subset S of N \\ {i}:\n      weight = |S|! * (n - |S| - 1)! / n!\n      phi[i] += weight * (v(S ∪ {i}) - v(S))\n  return phi\n\nAxioms (Shapley 1953):\n  Efficiency: sum phi[i] = v(N)\n  Symmetry: equal contributors get equal shares\n  Dummy: a player who adds nothing gets 0\n  Additivity: phi(v + w) = phi(v) + phi(w)\n\nComplexity: O(2^n * n) for n players",
 invariant:"The four axioms uniquely determine the Shapley value.",
 uses:"Profit sharing, cost allocation, feature attribution in ML (SHAP), coalition formation.",
 strength:"Unique and fair. Well-defined for any coalition game.",
 limits:"Exponential in n. Sampling needed for large n.",
 pitfall:"The Shapley value depends on the characteristic function v(S). A different v gives a different answer.",
 question:"What is the Shapley value of a three-player majority game?",
 answer:"Each player gets 1/3. The game is symmetric.",
 demo:"shapley",sample:"35 25 20 15\n51",refs:[
  ["Shapley, A value for n-person games, Contributions to the Theory of Games 1953","https://doi.org/10.1515/9781400881970-018"],
  ["Lundberg and Lee, A unified approach to interpreting model predictions (SHAP), NeurIPS 2017","https://arxiv.org/abs/1705.07874"],

{id:"nucleolus",title:"Nucleolus and the core",level:5,kind:"Cooperative game",status:"Concept lesson",
 summary:"The nucleolus is a solution concept that minimizes the maximum dissatisfaction of any coalition. It always exists and is unique. The core is the set of allocations that no coalition can improve upon.",
 mental:"Make the unhappiest coalition as happy as possible",
 mentalText:"For each allocation, compute the excess of every coalition (how much it could gain by deviating). Sort the excesses. The nucleolus lexicographically minimizes the sorted excess vector.",
 steps:["Compute the characteristic function.","For a candidate allocation, compute every coalition's excess.","Sort the excesses in decreasing order.","Find the allocation that lexicographically minimizes this vector."],
 pseudo:"nucleolus(v, n):\n  # solve a sequence of LPs\n  # each LP minimizes the maximum excess over a set of coalitions\n  # then fixes those coalitions and moves to the next tier\n  return allocation\n\nCore:\n  { x : sum x_i = v(N), sum_{i in S} x_i >= v(S) for all S }\n  The core can be empty.\n\nThe nucleolus is in the core if the core is non-empty.",
 invariant:"The nucleolus is unique. It minimizes the worst-case excess in the lexicographic order.",
 uses:"Cost allocation, profit sharing, bankruptcy problems.",
 strength:"Always exists and is unique. Single point solution.",
 limits:"Computing it requires solving a sequence of LPs. Exponential in the number of coalitions.",
 pitfall:"The core can be empty. The nucleolus still exists but is not in the core.",
 question:"What is the excess of a coalition?",
 answer:"v(S) - sum_{i in S} x_i. It measures how much the coalition could gain by leaving the grand coalition.",
 demo:"none",sample:"",refs:[
  ["Schmeidler, The nucleolus of a characteristic function game, SIAM J. Applied Math 1969","https://doi.org/10.1137/0117107"],

{id:"vcg",title:"VCG auctions",level:4,kind:"Mechanism design",status:"Runnable teaching lab",
 summary:"The Vickrey-Clarke-Groves mechanism allocates items to maximize social welfare and charges each winner the externality they impose on others. Truthful bidding is a dominant strategy.",
 mental:"Winner pays the harm they do to others",
 mentalText:"Find the allocation that maximizes total value. Each winner pays the difference between the welfare of others with and without them.",
 steps:["Collect bids from all bidders.","Find the allocation maximizing total reported value.","For each winner, compute the welfare of others under the optimal allocation.","Compute the welfare of others if the winner were excluded.","Payment = difference."],
 pseudo:"vcg(bids, items):\n  allocation = argmax over allocations of sum of bids\n  for each winner i:\n    welfare_others_with_i = sum of bids of other winners\n    welfare_others_without_i = max welfare with i excluded\n    payment[i] = welfare_others_without_i - welfare_others_with_i\n  return allocation, payments\n\nSingle item:\n  winner = highest bidder\n  payment = second-highest bid\n\nProperties:\n  dominant strategy: bid your true value\n  efficient: maximizes social welfare\n  individually rational: winners pay at most their value",
 invariant:"Truthful bidding is a dominant strategy because the payment does not depend on the bidder's own bid.",
 uses:"Spectrum auctions, ad auctions, public goods, kidney exchange.",
 strength:"Truthful, efficient, individually rational.",
 limits:"Payments can be low. Not budget-balanced. Vulnerable to collusion.",
 pitfall:"VCG is not revenue-optimal. In some settings the seller prefers a different mechanism.",
 question:"What does the winner pay in a single-item VCG auction?",
 answer:"The second-highest bid. This equals the externality imposed on the second-highest bidder.",
 demo:"vcg",sample:"10 20 15",refs:[

{id:"gsp",title:"Generalized second price auction",level:4,kind:"Mechanism design",status:"Runnable teaching lab",

{id:"ttc",title:"Top trading cycles",level:5,kind:"Mechanism design",status:"Runnable teaching lab",
 summary:"TTC finds a Pareto efficient and strategy-proof allocation of indivisible goods when each agent initially owns one good. Agents point to their favorite remaining good; goods point to their owners; cycles are executed.",
 mental:"Trade along cycles of mutual preferences",
 mentalText:"Build a directed graph: each agent points to their favorite remaining item, each item points to its owner. Cycles are guaranteed. Execute all cycles, remove those agents and items, repeat.",
 steps:["Each remaining agent points to their favorite remaining item.","Each remaining item points to its owner.","Find cycles.","Execute all cycles: each agent gets the item they pointed to.","Remove those agents and items.","Repeat."],
 pseudo:"ttc(preferences, ownership):\n  remaining_agents = all agents\n  remaining_items = all items\n  while remaining_agents:\n    for each agent a in remaining_agents:\n      a points to favorite item in remaining_items\n    for each item i in remaining_items:\n      i points to its owner\n    cycles = find_cycles(points)\n    for each cycle:\n      for each agent a in cycle:\n        assign a the item it points to\n        remove a and that item from remaining\n\nProperties:\n  strategy-proof: truthful is dominant\n  Pareto efficient\n  individually rational",
 invariant:"Cycles always exist because every node has out-degree 1. Executing cycles is safe and improves every agent.",
 uses:"School choice, kidney exchange, housing allocation, course allocation.",
 strength:"Strategy-proof and Pareto efficient.",
 limits:"Requires each agent to own exactly one good. Extensions exist for more general settings.",
 pitfall:"TTC is not the only strategy-proof mechanism. Serial dictatorship is also strategy-proof but may be less efficient.",
 question:"Why is TTC strategy-proof?",
 answer:"An agent's pointing to their favorite item never hurts them and cannot be manipulated to improve their allocation, because cycles are executed greedily.",

{id:"borda",title:"Borda count",level:3,kind:"Voting",status:"Runnable teaching lab",

def regret_matching(iters=2000):

   Tic-tac-toe helpers (used by game-state and minimax labs)
   ============================================================ */
function ttWinner(b){
 const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 for(const [a,b1,c] of lines){ if(b[a]!=='.'&&b[a]===b[b1]&&b[a]===b[c])return b[a]; }
 if(b.every(x=>x!=='.'))return 'draw';
 return null;
}
function ttMinimax(board, turn, memo){
 const key=board.join('')+turn;
 if(memo[key]!==undefined)return memo[key];
 const w=ttWinner(board);
 if(w==='X')return memo[key]={score:1,best:-1};
 if(w==='O')return memo[key]={score:-1,best:-1};
 if(w==='draw')return memo[key]={score:0,best:-1};
 let bestScore=turn==='X'?-2:2;
 let bestMove=-1;
 for(let i=0;i<9;i++){
  if(board[i]!=='.')continue;
  board[i]=turn;
  const r=ttMinimax(board,turn==='X'?'O':'X',memo);
  board[i]='.';
  if(turn==='X'){ if(r.score>bestScore){bestScore=r.score;bestMove=i} }
  else { if(r.score<bestScore){bestScore=r.score;bestMove=i} }
 }
 return memo[key]={score:bestScore,best:bestMove};
}
function ttParse(s){
 const cleaned=(s||'').replace(/[^XO.]/gi,'').toUpperCase().slice(0,9);
 let b=(cleaned||'.'.repeat(9)).padEnd(9,'.').split('');
 // If no X at all, default to empty
 if(!b.includes('X')&&!b.includes('O'))b='.'.repeat(9).split('');
 return b;
}
function ttDisplay(b){
 const rows=[];
 for(let r=0;r<3;r++)rows.push(b.slice(r*3,r*3+3).join(' '));
 return rows.join('\n');
}

  decoded:`Minimax explores the full game tree from this position. The value is from X's perspective: +1 X wins, -1 O wins, 0 draw.`
 };
}

function demoAlphaBeta(text){
 const parts=text.trim().split(/\s+/).map(Number);
 const depth=Math.max(1,Math.min(parts[0]||4,8));
 const bf=Math.max(2,Math.min(parts[1]||3,6));
 const seed=parts[2]||7;
 const numLeaves=Math.pow(bf,depth);
 if(numLeaves>200000)throw Error('Tree too large. Reduce depth or branching factor.');
 const rand=rngFactory(seed);
 const leaves=[];
 for(let i=0;i<numLeaves;i++)leaves.push(Math.floor(rand()*200)-100);
 let nodesNo=0;
 function minimax(d,idx,max){
  nodesNo++;
  if(d===0)return leaves[idx];
  if(max){
   let v=-Infinity;
   for(let i=0;i<bf;i++)v=Math.max(v,minimax(d-1,idx*bf+i,false));
   return v;
  } else {
   let v=Infinity;
   for(let i=0;i<bf;i++)v=Math.min(v,minimax(d-1,idx*bf+i,true));
   return v;
  }
 }
 const noPrune=minimax(depth,0,true);
 let nodesAB=0;
 function ab(d,idx,alpha,beta,max){
  nodesAB++;
  if(d===0)return leaves[idx];
  if(max){
   let v=-Infinity;
   for(let i=0;i<bf;i++){
    v=Math.max(v,ab(d-1,idx*bf+i,alpha,beta,false));
    alpha=Math.max(alpha,v);
    if(alpha>=beta)break;
   }
   return v;
  } else {
   let v=Infinity;
   for(let i=0;i<bf;i++){
    v=Math.min(v,ab(d-1,idx*bf+i,alpha,beta,true));
    beta=Math.min(beta,v);
    if(alpha>=beta)break;
   }
   return v;
  }
 }
 const withPrune=ab(depth,0,-Infinity,Infinity,true);
 return {
  encoded:`Depth: ${depth}, branching: ${bf}, leaves: ${numLeaves}\nSeed: ${seed}\n\nMinimax value: ${noPrune}\nAlpha-beta value: ${withPrune}\n\nMinimax nodes: ${nodesNo}\nAlpha-beta nodes: ${nodesAB}\nReduction: ${((1-nodesAB/nodesNo)*100).toFixed(1)}%`,
  decoded:`Alpha-beta returns the same value as minimax but visits fewer nodes. With random leaf values, the reduction is close to the theoretical best when move ordering is perfect.`
 };
}

function demoMoveOrdering(text){
 const parts=text.trim().split(/\s+/).map(Number);
 const depth=Math.max(2,Math.min(parts[0]||4,7));
 const bf=Math.max(2,Math.min(parts[1]||3,5));
 const seed=parts[2]||7;
 const numLeaves=Math.pow(bf,depth);
 if(numLeaves>200000)throw Error('Tree too large. Reduce depth or branching factor.');
 const rand=rngFactory(seed);
 const leaves=[];
 for(let i=0;i<numLeaves;i++)leaves.push(Math.floor(rand()*200)-100);
 // Random ordering
 let nodesRandom=0;
 function abRandom(d,idx,alpha,beta,max){
  nodesRandom++;
  if(d===0)return leaves[idx];
  if(max){
   let v=-Infinity;
   for(let i=0;i<bf;i++){
    v=Math.max(v,abRandom(d-1,idx*bf+i,alpha,beta,false));
    alpha=Math.max(alpha,v);
    if(alpha>=beta)break;
   }
   return v;
  } else {
   let v=Infinity;
   for(let i=0;i<bf;i++){
    v=Math.min(v,abRandom(d-1,idx*bf+i,alpha,beta,true));
    beta=Math.min(beta,v);
    if(alpha>=beta)break;
   }
   return v;
  }
 }
 abRandom(depth,0,-Infinity,Infinity,true);
 // Best ordering: at each node, sort children by their true value
 // For simplicity, order leaves within each subtree by their max/min
 function leafIdx(node,d,idx){
  // returns range of leaf indices
  if(d===0)return idx;
  return leafIdx(node,d-1,idx*bf);
 }
 let nodesOrdered=0;
 function abOrdered(d,idx,alpha,beta,max){
  nodesOrdered++;
  if(d===0)return leaves[idx];
  // Sort children by their minimax value
  const childVals=[];
  for(let i=0;i<bf;i++){
   childVals.push({i,v:subMinimax(d-1,idx*bf+i,!max)});
  }
  childVals.sort((a,b)=>max?b.v-a.v:a.v-b.v);
  if(max){
   let v=-Infinity;
   for(const {i} of childVals){
    v=Math.max(v,abOrdered(d-1,idx*bf+i,alpha,beta,false));
    alpha=Math.max(alpha,v);
    if(alpha>=beta)break;
   }
   return v;
  } else {
   let v=Infinity;
   for(const {i} of childVals){
    v=Math.min(v,abOrdered(d-1,idx*bf+i,alpha,beta,true));
    beta=Math.min(beta,v);
    if(alpha>=beta)break;
   }
   return v;
  }
 }
 function subMinimax(d,idx,max){
  if(d===0)return leaves[idx];
  if(max){
   let v=-Infinity;
   for(let i=0;i<bf;i++)v=Math.max(v,subMinimax(d-1,idx*bf+i,false));
   return v;
  } else {
   let v=Infinity;
   for(let i=0;i<bf;i++)v=Math.min(v,subMinimax(d-1,idx*bf+i,true));
   return v;
  }
 }
 abOrdered(depth,0,-Infinity,Infinity,true);
 return {
  encoded:`Depth: ${depth}, branching: ${bf}, leaves: ${numLeaves}\n\nNodes (random order): ${nodesRandom}\nNodes (perfect order): ${nodesOrdered}\nReduction: ${((1-nodesOrdered/nodesRandom)*100).toFixed(1)}%`,
  decoded:`Perfect move ordering achieves the O(b^(d/2)) best case. Real engines approximate this with killer moves, history heuristics and transposition table moves.`
 };
}

function demoTransposition(text){

 const depth=Math.max(2,Math.min(parts[0]||6,10));

 const counts={};
 let nodes=0;
 function visit(state,d){
  nodes++;
  const key=state.slice().sort((a,b)=>a-b).join(',');
  counts[key]=(counts[key]||0)+1;
  if(d===0)return;
  for(let i=0;i<bf;i++)visit([...state,i],d-1);
 }
 visit([],depth);
 const unique=Object.keys(counts).length;
 const repeatStates=Object.values(counts).filter(c=>c>1).length;
 let repeats=0;
 for(const k in counts)repeats+=counts[k]-1;
 return {
  encoded:`Depth: ${depth}, branching: ${bf}\nTotal nodes visited: ${nodes}\nUnique states (as multisets): ${unique}\nStates reached more than once: ${repeatStates}\nTotal recomputations avoided: ${repeats}`,
  decoded:`A transposition table would store ${unique} entries and avoid ${repeats} recomputations. In real games the savings are larger because many move orders lead to the same position.`
 };
}

function demoNim(text){

 if(xor===0)out+='Position is a P-position (LOSING for the player to move with optimal play).';
 else{
  out+='Position is an N-position (WINNING).\nWinning moves (reduce a heap to make the XOR zero):\n';
  let any=false;
  for(let i=0;i<heaps.length;i++){
   const target=heaps[i]^xor;
   if(target<heaps[i]){
    out+=`  Reduce heap ${i+1} from ${heaps[i]} to ${target} (take ${heaps[i]-target})\n`;
    any=true;
   }
  }
  if(!any)out+='  (none)';
 }
 return {encoded:out, decoded:`The nim-sum (bitwise XOR of heap sizes) determines the winner. If zero, the position is a P-position. Otherwise move to make the XOR zero.`};
}

function demoNash(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter two lines: A\'s payoffs (4 numbers), then B\'s payoffs (4 numbers).');
 const A=lines[0].split(/[\s,]+/).filter(Boolean).map(Number);
 const B=lines[1].split(/[\s,]+/).filter(Boolean).map(Number);
 if(A.length!==4||B.length!==4)throw Error('Expected 2x2 game: 4 numbers per line.');
 const a=[[A[0],A[1]],[A[2],A[3]]];
 const b=[[B[0],B[1]],[B[2],B[3]]];
 const eqs=[];
 // Pure
 for(let i=0;i<2;i++)for(let j=0;j<2;j++){
  const aOk=a[i][j]>=a[1-i][j];
  const bOk=b[i][j]>=b[i][1-j];
  if(aOk&&bOk)eqs.push({type:'pure',i,j});
 }
 // Mixed
 const dq=a[0][0]-a[0][1]-a[1][0]+a[1][1];
 if(Math.abs(dq)>1e-12){
  const q=(a[1][1]-a[0][1])/dq;
  const dp=b[0][0]-b[0][1]-b[1][0]+b[1][1];
  if(Math.abs(dp)>1e-12){
   const p=(b[1][1]-b[1][0])/dp;
   if(p>=-1e-9&&p<=1+1e-9&&q>=-1e-9&&q<=1+1e-9){
    // Verify indifference
    const u1=p*a[0][0]+(1-p)*a[0][1];
    const u2=p*a[1][0]+(1-p)*a[1][1];
    if(Math.abs(u1-u2)<1e-6)eqs.push({type:'mixed',p:Math.max(0,Math.min(1,p)),q:Math.max(0,Math.min(1,q))});
   }
  }
 }
 let out='Payoff matrix A:\n  '+a.map(r=>r.join('  ')).join('\n  ')+'\nPayoff matrix B:\n  '+b.map(r=>r.join('  ')).join('\n  ')+'\n\nEquilibria:\n';
 if(!eqs.length)out+='  (none found — this can happen for degenerate games)';
 for(const e of eqs){
  if(e.type==='pure')out+=`  Pure: player 1 → row ${e.i+1}, player 2 → col ${e.j+1}\n`;
  else out+=`  Mixed: player 1 → (${e.p.toFixed(3)}, ${(1-e.p).toFixed(3)}), player 2 → (${e.q.toFixed(3)}, ${(1-e.q).toFixed(3)})\n`;
 }
 return {encoded:out, decoded:`Support enumeration for 2x2 games. Pure equilibria are checked first, then the mixed equilibrium via the indifference conditions.`};
}

function demoRegret(text){

 const payoff=(a,b)=>{ if(a===b)return 0; return ((a-b)%3+3)%3===1?1:-1; };
 const R=[0,0,0];
 const S=[0,0,0];
 const rand=rngFactory(123);
 for(let t=0;t<iters;t++){
  const pos=R.map(r=>Math.max(0,r));
  const sum=pos.reduce((a,b)=>a+b,0);
  let strat;
  if(sum===0)strat=[1/3,1/3,1/3];
  else strat=pos.map(p=>p/sum);
  let r=rand();
  let a=0;
  for(let i=0;i<3;i++){if(r<strat[i]){a=i;break}r-=strat[i]}
  const b=Math.floor(rand()*3);
  const u=payoff(a,b);
  for(let i=0;i<3;i++)R[i]+=payoff(i,b)-u;
  for(let i=0;i<3;i++)S[i]+=strat[i];
 }
 const avg=S.map(s=>s/iters);
 return {
  encoded:`Iterations: ${iters}\nActions: [R, P, S]\n\nCumulative regrets: [${R.map(x=>x.toFixed(1)).join(', ')}]\nAverage strategy:\n  R: ${avg[0].toFixed(3)}\n  P: ${avg[1].toFixed(3)}\n  S: ${avg[2].toFixed(3)}`,
  decoded:`Regret matching converges to a Nash equilibrium of rock-paper-scissors: uniform random. The average strategy approaches (1/3, 1/3, 1/3).`
 };
}

function demoShapley(text){

 const weights=lines[0].split(/[\s,]+/).filter(Boolean).map(Number);

 const n=weights.length;
 if(n<1||n>12)throw Error('Use 1 to 12 players.');
 const fact=[1];
 for(let i=1;i<=n;i++)fact[i]=fact[i-1]*i;
 const sv=new Array(n).fill(0);
 for(let mask=0;mask<(1<<n);mask++){
  const size=popcount(mask);
  let wS=0;
  for(let i=0;i<n;i++)if(mask>>i&1)wS+=weights[i];
  const vS=wS>=quota?1:0;
  for(let i=0;i<n;i++){
   if(mask>>i&1)continue;
   const wNew=wS+weights[i];
   const vNew=wNew>=quota?1:0;
   sv[i]+=fact[size]*fact[n-size-1]/fact[n]*(vNew-vS);
  }
 }
 return {
  encoded:`Weights: [${weights.join(', ')}]\nQuota: ${quota}\nPlayers: ${n}\n\nShapley values:\n${sv.map((v,i)=>`  Player ${i+1} (weight ${weights[i]}): ${v.toFixed(4)}`).join('\n')}\nSum: ${sv.reduce((a,b)=>a+b,0).toFixed(4)}`,
  decoded:`The Shapley value is the unique fair division satisfying efficiency, symmetry, dummy and additivity. In a simple voting game it measures each player's average marginal contribution to winning coalitions.`
 };
}

function demoTtc(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(!lines.length)throw Error('Enter one line per agent with their preference order.');
 const n=lines.length;
 if(n<2||n>8)throw Error('Use 2 to 8 agents.');
 const prefs=lines.map(l=>l.split(/[\s,]+/).filter(Boolean).map(x=>parseInt(x)-1));
 // Validate: each preference list should be a permutation of 0..n-1
 for(const p of prefs){
  if(p.length!==n||new Set(p).size!==n||p.some(x=>x<0||x>=n))throw Error('Each agent must rank all items 1..'+n+' exactly once.');
 }
 const owner={};
 for(let i=0;i<n;i++)owner[i]=i;
 const remainingAgents=new Set([...Array(n).keys()]);
 const remainingItems=new Set([...Array(n).keys()]);
 const assignment=new Array(n).fill(-1);
 const rounds=[];
 let safety=0;
 while(remainingAgents.size>0&&safety++<100){
  const pointsTo={};
  for(const a of remainingAgents){
   for(const it of prefs[a]){ if(remainingItems.has(it)){pointsTo[a]=it;break} }
  }
  // Build next[] for functional graph
  const next=new Map();
  for(const a of remainingAgents){
   const it=pointsTo[a];
   if(it===undefined){next.set(a,undefined);continue}
   const ow=owner[it];
   if(remainingAgents.has(ow))next.set(a,ow);
   else next.set(a,undefined);
  }
  // Find cycles
  const state=new Map();
  for(const a of remainingAgents)state.set(a,0);
  const cycles=[];
  for(const start of remainingAgents){
   if(state.get(start)!==0)continue;
   const path=[];
   const idx=new Map();
   let cur=start;
   while(cur!==undefined&&state.get(cur)===0){
    state.set(cur,1);
    idx.set(cur,path.length);
    path.push(cur);
    cur=next.get(cur);
   }
   if(cur!==undefined&&state.get(cur)===1){
    cycles.push(path.slice(idx.get(cur)));
   }
   for(const a of path)state.set(a,2);
  }
  if(!cycles.length)break;
  const info=[];
  for(const cyc of cycles){
   for(const a of cyc){
    const it=pointsTo[a];
    assignment[a]=it;
    info.push(`Agent ${a+1} → item ${it+1}`);
    remainingAgents.delete(a);
    remainingItems.delete(it);
   }
  }
  rounds.push(info);
 }
 return {
  encoded:`Preferences:\n${prefs.map((p,i)=>`  Agent ${i+1}: [${p.map(x=>x+1).join(', ')}]`).join('\n')}\n\nAllocation:\n${assignment.map((it,i)=>`  Agent ${i+1} → item ${it+1}`).join('\n')}\n\nRounds:\n${rounds.map((r,i)=>`  Round ${i+1}: ${r.join(', ')}`).join('\n')}`,
  decoded:`Top Trading Cycles: agents point to their favorite remaining item, items point to owners. Cycles are executed. TTC is strategy-proof and Pareto efficient.`
 };
}

function demoCondorcetSchulze(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(!lines.length)throw Error('Enter one ranking per line.');
 const rankings=lines.map(l=>l.split(/[\s,]+/).filter(Boolean));
 const candidates=[...new Set(rankings.flat())].sort();
 const n=candidates.length;
 const idx=Object.fromEntries(candidates.map((c,i)=>[c,i]));
 const P=Array.from({length:n},()=>new Array(n).fill(0));
 for(const r of rankings){
  for(let i=0;i<r.length;i++)for(let j=i+1;j<r.length;j++){
   P[idx[r[i]]][idx[r[j]]]++;
  }
 }
 // Condorcet winner
 let condorcet=null;
 for(let i=0;i<n;i++){
  let winsAll=true;
  for(let j=0;j<n;j++)if(i!==j&&P[i][j]<=P[j][i]){winsAll=false;break}
  if(winsAll)condorcet=candidates[i];
 }
 // Schulze
 const d=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?0:(P[i][j]>P[j][i]?P[i][j]:-Infinity)));
 for(let k=0;k<n;k++)for(let i=0;i<n;i++)for(let j=0;j<n;j++){
  if(d[i][k]>-Infinity&&d[k][j]>-Infinity){
   d[i][j]=Math.max(d[i][j],Math.min(d[i][k],d[k][j]));
  }
 }
 const wins=d.map((row,i)=>row.filter((x,j)=>i!==j&&x>d[j][i]).length);
 const order=candidates.map((c,i)=>({c,w:wins[i]})).sort((a,b)=>b.w-a.w);
 const matrix=P.map((row,i)=>`  ${candidates[i]}: ${row.map((x,j)=>i===j?'-':x).join(' ')}`).join('\n');
 return {
  encoded:`Rankings:\n${rankings.map((r,i)=>`  Voter ${i+1}: ${r.join(' > ')}`).join('\n')}\n\nPairwise matrix (row beats column):\n${matrix}\n\nCondorcet winner: ${condorcet||'(none)'}\nSchulze ranking: ${order.map(x=>x.c).join(' > ')}`,
  decoded:`Condorcet: a candidate who beats every other head-to-head. Schulze: order by the strength of the strongest path of pairwise victories.`
 };
}

function demoIrv(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(!lines.length)throw Error('Enter one ranking per line.');
 let ballots=lines.map(l=>l.split(/[\s,]+/).filter(Boolean));
 const eliminated=new Set();
 const rounds=[];
 let safety=0;
 while(safety++<20){
  const counts={};
  for(const b of ballots){
   for(const c of b){
    if(!eliminated.has(c)){counts[c]=(counts[c]||0)+1;break}
   }
  }
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  rounds.push(sorted);
  if(!sorted.length)return {encoded:'No candidates remain.',decoded:'All candidates were eliminated.'};
  if(sorted[0][1]>total/2){
   return {
    encoded:`Ballots:\n${lines.map((l,i)=>`  ${i+1}: ${l}`).join('\n')}\n\nRounds:\n${rounds.map((r,i)=>`  Round ${i+1}: ${r.map(([c,v])=>`${c}=${v}`).join(', ')}`).join('\n')}\n\nWinner: ${sorted[0][0]}`,
    decoded:`Instant-runoff voting eliminates the candidate with the fewest first-place votes and transfers their votes. Repeat until someone has a majority.`
   };
  }
  if(sorted.length<=1)break;
  eliminated.add(sorted[sorted.length-1][0]);
 }
 return {
  encoded:`Ballots:\n${lines.map((l,i)=>`  ${i+1}: ${l}`).join('\n')}\n\nRounds:\n${rounds.map((r,i)=>`  Round ${i+1}: ${r.map(([c,v])=>`${c}=${v}`).join(', ')}`).join('\n')}\n\n(no majority winner)`,
  decoded:`IRV did not produce a majority winner. Check the ballots.`
 };
}

function demoFairDivision(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter two lines: A\'s valuations, then B\'s valuations.');
 const a=lines[0].split(/[\s,]+/).filter(Boolean).map(Number);
 const b=lines[1].split(/[\s,]+/).filter(Boolean).map(Number);
 if(a.length!==b.length)throw Error('Both parties must value the same number of items.');
 const n=a.length;
 const sa=a.reduce((x,y)=>x+y,0),sb=b.reduce((x,y)=>x+y,0);
 const va=a.map(x=>100*x/sa),vb=b.map(x=>100*x/sb);
 const owner=new Array(n);
 let ta=0,tb=0;
 for(let i=0;i<n;i++){
  if(va[i]>=vb[i]){owner[i]='A';ta+=va[i]}
  else{owner[i]='B';tb+=vb[i]}
 }
 const from=ta>tb?'A':'B';
 const order=[...Array(n).keys()].filter(i=>owner[i]===from).sort((i,j)=>{
  if(from==='A')return (va[i]/vb[i])-(va[j]/vb[j]);
  return (vb[i]/va[i])-(vb[j]/va[j]);
 });
 for(const i of order){
  if(Math.abs(ta-tb)<1e-9)break;
  if(from==='A'){owner[i]='B';ta-=va[i];tb+=vb[i]}
  else{owner[i]='A';tb-=vb[i];ta+=va[i]}
 }
 return {
  encoded:`A's valuations: [${a.join(', ')}]\nB's valuations: [${b.join(', ')}]\n\nNormalized: A=[${va.map(x=>x.toFixed(1)).join(', ')}], B=[${vb.map(x=>x.toFixed(1)).join(', ')}]\n\nAllocation:\n${[...Array(n).keys()].map(i=>`  Item ${i+1}: ${owner[i]}`).join('\n')}\n\nA's total: ${ta.toFixed(2)}\nB's total: ${tb.toFixed(2)}`,
  decoded:`Adjusted Winner: give each item to the higher valuer, then transfer items from the advantaged party to equalize. Envy-free and Pareto optimal for two parties.`
 };
}

 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!d||d.schemaVersion!==1||!Array.isArray(d.completed)||!Array.isArray(d.bookmarks)||typeof d.drafts!=='object')throw Error('bad schema');
  if([...d.completed,...d.bookmarks].some(id=>typeof id!=='string'||!byId[id]))throw Error('unknown id');
  state.completed=new Set(d.completed);
  state.bookmarks=new Set(d.bookmarks);
  state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';
  state.current=byId[d.current]?d.current:null;
  state.drafts=Object.fromEntries(Object.entries(d.drafts).filter(([k,v])=>byId[k]&&typeof v==='string'&&v.length<100000));
  applyTheme();save();renderTree();
  state.current?openLesson(state.current):renderHome();
  toast('Progress imported');
 }catch(e){toast('Import rejected: invalid progress data')}};
 r.readAsText(file);
}

function bindGlobal(){
 $('#themeSelect').onchange=()=>{state.theme=$('#themeSelect').value;applyTheme();save()};
 $('#printBtn').onclick=()=>print();
 $('#exportBtn').onclick=exportProgress;
 $('#importBtn').onclick=()=>$('#importFile').click();
 $('#importFile').onchange=e=>{if(e.target.files[0])importProgressFile(e.target.files[0]);e.target.value=''};
 $('#searchInput').oninput=renderTree;
 $('#chapterFilter').onchange=renderTree;
 $('#homeLink').onclick=e=>{e.preventDefault();renderHome();history.replaceState(null,'','#home')};
 $('#courseTree').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)openLesson(b.dataset.lesson)};
 document.querySelectorAll('[data-page="home"]').forEach(b=>b.onclick=renderHome);
 document.querySelectorAll('[data-page="progress"]').forEach(b=>b.onclick=renderProgressPage);
 document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#searchInput').focus()}
  if(e.key.toLowerCase()==='t'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
   state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';
   applyTheme();save();
  }
 });
}

function init(){
 load();
 applyTheme();
 CHAPTERS.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.title;$('#chapterFilter').append(op)});
 bindGlobal();
 renderTree();
 const hash=location.hash.replace(/^#/,'');
 if(hash&&byId[hash])renderLesson(hash);
 else if(state.current&&byId[state.current])renderLesson(state.current);
 else renderHome();
 progress();
}
init();
</script></body></html>
